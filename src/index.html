<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>

  <body>
    <header class="header">
      <a
        href="index.html"
        class="logo"
      >
        <img
          src="./images/logo.png"
          alt="Moyo logo"
          class="logo__img"
        />
      </a>

      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a
              href="#"
              class="nav__link is-active"
            >
              Apple
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Samsung
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Smartphones
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
              data-qa="nav-hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Gadgets
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Tablets
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Photo
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="catalog">
      <article
        class="card"
        data-qa="card"
      >
        <a
          class="card__image"
          href="#"
        ></a>

        <h2 class="card__title">
          <a
            class="card__link"
            href="#"
          >
            APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
          </a>
        </h2>

        <div class="card__code">Product code: 195434</div>

        <div class="card__meta">
          <div
            class="stars stars--4"
            aria-label="Rating 4 of 5"
          >
            <span class="stars__item"></span>
            <span class="stars__item"></span>
            <span class="stars__item"></span>
            <span class="stars__item"></span>
            <span class="stars__item"></span>
          </div>
          <div class="card__meta-reviews">Reviews: 5</div>
        </div>

        <div class="card__price-row">
          <div class="card__price-label">Price:</div>
          <div class="card__price-amount">$2,199</div>
        </div>

        <a
          class="card__buy"
          href="#"
          data-qa="card-hover"
        >
          BUY
        </a>
      </article>
    </main>
  </body>
</html>
